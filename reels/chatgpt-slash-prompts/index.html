<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Slash Prompts Reel</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--cc:#FF7A3D;--cc2:#FFB48C;--cx:#22D3B4;--cx2:#93F5E2;--amber:#FFC24D;--red:#FF4D6A;--txt:#F7F4EE;--mut:#9AA3B5;--line:#283042;--gp:#7E14D0;--gs:#A25BFF;--gk:#0D0D0D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05060A}
body{font-family:'Cairo','Inter',sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#05060A}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#cam{position:absolute;inset:0;perspective:2000px;transform-style:preserve-3d;transform-origin:50% 50%}
.scene{position:absolute;inset:0;display:none;perspective:1600px;backface-visibility:hidden;transform-origin:50% 50%}
.abs{position:absolute}
.ctr{left:0;right:0;text-align:center}
.ar{direction:rtl;font-family:'Cairo',sans-serif}
.en{font-family:'Inter','Cairo',sans-serif;direction:ltr;unicode-bidi:isolate}
.mono{font-family:'JetBrains Mono',monospace;direction:ltr;unicode-bidi:isolate}
.line{perspective:1000px}
.w{display:inline-block;transform-origin:50% 85%;white-space:pre}
.o,.acc-o{color:var(--cc)} .t,.acc-t{color:var(--cx)} .m{color:var(--mut)} .a,.acc-a{color:var(--amber)} .acc-r{color:var(--red)}
.acc-g,.grad{background:linear-gradient(90deg,var(--cc),#FFD27A 50%,var(--cx));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none!important}
.acc-g{padding:0 .04em}
.cap{font-size:68px;font-weight:900;line-height:1.3;text-shadow:0 8px 40px rgba(0,0,0,.7)}
.lt{display:inline-block;transform-origin:50% 90%;white-space:pre}

/* hook image cards */
.card3d{position:absolute;border-radius:40px;background:#0D1018;overflow:hidden}
.card3d>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shine{position:absolute;top:-60%;left:0;width:200px;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
#h_cc{border:4px solid rgba(255,122,61,.85);box-shadow:0 0 100px rgba(255,122,61,.38),0 40px 90px rgba(0,0,0,.5)}
#h_cx{border:4px solid rgba(34,211,180,.85);box-shadow:0 0 100px rgba(34,211,180,.38),0 40px 90px rgba(0,0,0,.5)}
.tag{display:inline-flex;align-items:center;gap:10px;height:68px;padding:0 28px;border-radius:999px;background:rgba(12,15,22,.92);border:2px solid rgba(255,255,255,.2);font:800 34px 'Cairo';color:#fff;white-space:nowrap;direction:rtl;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.ctag{position:absolute;left:0;right:0;bottom:20px;text-align:center}

/* coins + extruded text */
.coin,.ext{position:absolute;transform-style:preserve-3d}
.coinIn,.extIn{position:absolute;inset:0;transform-style:preserve-3d}
.disc{position:absolute;inset:0;border-radius:50%}
.cface{display:flex;align-items:center;justify-content:center;backface-visibility:hidden}
.extL{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1;white-space:nowrap;direction:rtl}
.extF{background-image:linear-gradient(100deg,transparent 44%,rgba(255,255,255,.95) 50%,transparent 56%),linear-gradient(90deg,#FF7A3D,#FFD27A 50%,#22D3B4);background-size:300% 100%,100% 100%;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;color:transparent}

/* pills */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:14px;height:112px;padding:0 46px;border-radius:999px;font:800 54px 'Inter','Cairo';letter-spacing:-1px;white-space:nowrap}
.pO{background:rgba(255,122,61,.15);border:3px solid var(--cc);color:var(--cc);box-shadow:0 0 50px rgba(255,122,61,.35)}
.pT{background:rgba(34,211,180,.15);border:3px solid var(--cx);color:var(--cx);box-shadow:0 0 50px rgba(34,211,180,.35)}
/* prompt pill (input = photo + slash word) */
.ppill{display:inline-flex;align-items:center;gap:22px;height:112px;padding:0 40px 0 14px;border-radius:999px;background:rgba(12,15,22,.95);border:3px solid var(--cc);font:700 44px 'JetBrains Mono';color:#fff;white-space:nowrap;direction:ltr;box-shadow:0 0 60px rgba(255,122,61,.4),0 20px 50px rgba(0,0,0,.5)}
.ppill img{width:84px;height:84px;border-radius:24px;object-fit:cover;display:block}
.ppill .lg{width:64px;height:64px;color:#fff;margin-left:12px}
.ppill b{font-weight:700}

/* section cards */
.bignum{font:900 560px 'Inter';line-height:1;color:transparent;-webkit-text-stroke:5px var(--cc);letter-spacing:-24px}

/* header */
.hdr{display:inline-flex;align-items:center;gap:22px;height:88px;padding:0 30px 0 14px;border-radius:999px;background:rgba(16,20,29,.88);border:2px solid var(--line);direction:ltr;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.hn{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 28px 'Inter';color:#0A0C11}
.hname{font:800 40px 'Inter'}
.segs{display:flex;gap:8px}
.segs i{display:block;width:48px;height:10px;border-radius:5px;background:#2A3242;overflow:hidden}
.segs b{display:block;height:100%;width:0%}

/* chips */
.chips{display:flex;justify-content:center;gap:18px;direction:rtl;perspective:900px}
.chip{display:inline-flex;align-items:center;gap:10px;height:76px;padding:0 32px;border-radius:999px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.16);font-size:36px;font-weight:800;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.chA{background:rgba(255,194,77,.12);border-color:rgba(255,194,77,.55);color:#FFE2A6}
.chT{background:rgba(34,211,180,.14);border-color:rgba(34,211,180,.7);color:var(--cx2)}

/* ===== ChatGPT app frame (light, as in the app) ===== */
.gpt{position:absolute;border-radius:56px;background:#F7F7F8;overflow:hidden;color:var(--gk);font-family:'Inter',sans-serif}
.gtop{position:absolute;left:0;right:0;top:0;height:112px;z-index:3;background:linear-gradient(#F7F7F8 82%,rgba(247,247,248,0))}
.gbtn{position:absolute;top:16px;width:84px;height:84px;border-radius:50%;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.gbtn svg{width:42px;height:42px}
.gseg{position:absolute;top:16px;left:50%;margin-left:-170px;width:340px;height:84px;padding:7px;border-radius:999px;background:#EAEAEA;display:flex;gap:4px}
.gseg span{flex:1;display:flex;align-items:center;justify-content:center;border-radius:999px;font:500 34px 'Inter';color:var(--gk)}
.gseg .on{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.gchat{position:absolute;left:0;right:0;top:112px;overflow:hidden}
.gthr{position:absolute;left:0;top:0;width:900px;height:2000px}
.gu,.ga{position:absolute;left:0;top:0;width:900px;display:none}
.gu img{position:absolute;border-radius:28px;object-fit:cover;display:block}
.gub{position:absolute;height:84px;padding:0 34px;border-radius:42px;background:#ECECEC;font:500 40px 'Inter';display:flex;align-items:center;white-space:nowrap;direction:ltr}
.gal{position:absolute;left:28px;top:0;display:flex;align-items:center;gap:16px;height:52px;font:500 34px 'Inter';direction:ltr;white-space:nowrap}
.glogo{width:44px;height:44px;color:var(--gk);display:block}
.gsh{background:linear-gradient(90deg,#8F8F8F 0%,#8F8F8F 38%,#E4E4E4 50%,#8F8F8F 62%,#8F8F8F 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.gim{position:absolute;left:28px;top:66px;border-radius:28px;overflow:hidden;background:#E9E9E9}
.gim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.gim.chk{background:repeating-conic-gradient(#E2E2E2 0 25%,#FFFFFF 0 50%) 0 0/36px 36px}
.gscan{position:absolute;left:0;right:0;height:90px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.gcomp{position:absolute;left:20px;right:20px;bottom:20px;border-radius:46px;background:#fff;box-shadow:0 4px 30px rgba(0,0,0,.09),0 0 0 1px rgba(0,0,0,.04)}
.gslot{position:absolute;left:26px;top:24px;width:124px;height:124px}
.gthw{position:absolute;left:26px;top:24px;width:124px;height:124px;display:none}
.gthw img{width:124px;height:124px;border-radius:24px;object-fit:cover;display:block}
.gx{position:absolute;right:-10px;top:-10px;width:40px;height:40px;border-radius:50%;background:var(--gk);border:3px solid #fff;display:flex;align-items:center;justify-content:center}
.gx svg{width:20px;height:20px}
.gtxt{position:absolute;left:36px;right:36px;top:30px;font:500 44px 'Inter';line-height:60px;height:60px;white-space:nowrap;direction:ltr;text-align:left;color:var(--gk)}
.gtxt.ml{white-space:normal;height:auto;font-size:36px;line-height:50px}
.gph{color:var(--gp)}
.gcar{display:inline-block;width:3px;height:48px;background:var(--gk);vertical-align:-9px;margin-left:3px}
.gtxt.ml .gcar{height:40px;vertical-align:-7px}
.grow{position:absolute;left:16px;right:16px;bottom:18px;height:84px;display:flex;align-items:center;justify-content:space-between;direction:ltr}
.gic{width:84px;height:84px;display:flex;align-items:center;justify-content:center}
.gic svg{width:46px;height:46px}
.gr{display:flex;align-items:center;gap:14px}
.gsend{width:84px;height:84px;border-radius:50%;background:var(--gs);display:flex;align-items:center;justify-content:center}
.gsend svg{width:44px;height:44px}
.gdim{position:absolute;inset:0;background:#05060A;opacity:0;z-index:6}

/* original photo card + big result */
.owrap{position:absolute;display:none}
.ocard{position:absolute;inset:0;border-radius:32px;overflow:hidden;background:#0D1018}
.ocard img{width:100%;height:100%;object-fit:cover;display:block}
.otag{position:absolute;left:-200px;right:-200px;top:-92px;text-align:center}
.bres{position:absolute;display:none}
.bres img{width:100%;height:100%;object-fit:cover;display:block;border-radius:30px}
.bres.png img{object-fit:contain;border-radius:0;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.ppw{position:absolute;left:0;right:0;text-align:center;display:none}

/* tip */
.tcomp{position:absolute;border-radius:46px;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.07);color:var(--gk)}

/* poll */
.poll{position:absolute;border-radius:48px;background:#F8F6F1;color:#11141B;padding:40px 44px 44px;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.07)}
.pq{font-size:58px;font-weight:900;text-align:center;line-height:1.4}
.ptiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;direction:ltr;margin-top:22px}
.ptile{position:relative;height:104px;border-radius:24px;background:#E9E5DC;overflow:hidden;display:flex;align-items:center;gap:16px;padding:0 14px}
.ptile .pf{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--cc)}
.ptile .im{position:relative;width:76px;height:76px;flex:none}
.ptile .im img{width:76px;height:76px;border-radius:16px;object-fit:cover;display:block}
.ptile .pk{position:absolute;inset:0;border-radius:16px;background:rgba(10,12,17,.55);display:flex;align-items:center;justify-content:center;font:900 44px 'Inter';color:#fff;opacity:0}
.ptile span{position:relative;font:700 29px 'JetBrains Mono';color:#1A1D24;white-space:nowrap}
.stamp{padding:16px 34px;border:6px solid var(--red);border-radius:22px;color:var(--red);font-size:56px;font-weight:900;background:rgba(255,255,255,.94);box-shadow:0 20px 60px rgba(0,0,0,.45);white-space:nowrap}

/* overlays */
#cursor{position:absolute;left:0;top:0;transform-origin:10.7px 5.3px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55));display:none}
#ripple{position:absolute;left:0;top:0;border-radius:50%;border:5px solid rgba(255,255,255,.95);box-shadow:0 0 24px rgba(255,255,255,.6),0 0 0 3px rgba(162,91,255,.35);display:none}
#wipe{position:absolute;inset:0;overflow:hidden;display:none}
#wipe i{position:absolute;left:-760px;top:-740px;width:2600px;height:3400px}
#glitch{position:absolute;inset:0;display:none;mix-blend-mode:difference;overflow:hidden}
#glitch i{position:absolute;left:0;width:1080px}
#flash{position:absolute;inset:0;opacity:0;background:#fff}
#grain{opacity:.045}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 48%,rgba(0,0,0,.6) 100%)}
</style>
</head>
<body>
<div id="stage">
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="cam">

<section class="scene" id="S1">
  <div class="abs ctr ar line cap" id="h_t" style="top:250px;font-size:92px" data-k="صورة وحدة + {كلمة} وحدة"></div>
  <div class="card3d" id="h_cc" style="left:70px;top:440px;width:420px;height:525px"><img src="img/o01.jpg"><div class="shine" id="h_ccs"></div><div class="ctag"><span class="tag">📷 قبل</span></div></div>

  <div class="abs ctr" id="h_pp" style="top:1010px"><span class="ppill" style="border-color:#FFD27A;box-shadow:0 0 60px rgba(255,210,122,.35),0 20px 50px rgba(0,0,0,.5)"><span class="lg logo"></span><span><b style="color:#FFD27A">/</b>metaAds</span></span></div>

<!-- ================= S2 ANSWER: the slash ================= -->
<section class="scene" id="S2">
  <div class="abs ctr ar line" id="a_l" style="top:390px;font-size:74px;font-weight:800;color:var(--mut)" data-k="السر:"></div>
  <div class="ext" id="a_big" style="left:0;top:455px;width:1080px;height:500px;font:900 540px 'Inter'"></div>
  <div class="abs ctr" id="a_row" style="top:1000px;display:flex;justify-content:center;align-items:center;gap:26px;perspective:1000px;direction:rtl">
    <span class="pill pO ar" id="a_p1">📷 صورة</span><span id="a_plus" style="display:inline-block;font:900 84px Inter">+</span><span class="pill pT en" id="a_p2">⌨️ /prompt</span>

<!-- ================= S3 CARD 01 ================= -->
<section class="scene" id="S3">
  <div class="abs ctr bignum" id="k1_num" style="top:300px">01</div>
  <div class="abs ctr ar" id="k1_k" style="top:800px;font-size:56px;font-weight:800;color:var(--mut)">إلا عندك منتوج 👟</div>
  <div class="abs ctr letters en" id="k1_n" style="top:875px;font:800 150px Inter;color:var(--cc);perspective:900px;text-shadow:0 0 70px rgba(255,122,61,.55)">Products</div>
  <div class="abs" id="k1_bar" style="left:290px;top:1080px;width:500px;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--cc),var(--cc2))"></div>

  <div class="abs ctr chips" id="o_ch1" style="top:500px"><span class="chip ar chA">🎲 النتيجة كتختالف من مرة لمرة</span></div>

<script>
/* ===================== utils ===================== */
const W=1080,H=1920;
/* Nominal timeline of 59.5 s played at FS=120/92 (the approved 92 BPM pace) = 77.6 s.
   Every scene boundary and every big hit sits on the 0.5 s nominal beat grid. */
const FS=120/92, TOT=59.5, DUR=Math.round(TOT*FS*1000)/1000, BEAT=.5*FS;
const ADJ=t=>t, R=t=>t*FS, AD=t=>t*FS;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const P=(t,a,d)=>clamp((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const E={
  o2:x=>1-(1-x)*(1-x), o3:x=>1-Math.pow(1-x,3), o5:x=>1-Math.pow(1-x,5), i3:x=>x*x*x,
  io3:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  back:x=>{const c1=2.0,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function noise1(t){const i=Math.floor(t),f=t-i,u=f*f*(3-2*f);return (hash(i)+(hash(i+1)-hash(i))*u)*2-1}
function hex(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function mixA(a,b,p){return a.map((v,i)=>Math.round(v+(b[i]-v)*p))}
function mixHex(a,b,p){return 'rgb('+mixA(hex(a),hex(b),p).join(',')+')'}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function tr(el,{x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1,o}={}){
  el.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) rotateZ(${rz.toFixed(2)}deg) scale(${Math.max(s,.0001).toFixed(4)})`;
  if(o!==undefined) el.style.opacity=clamp(o).toFixed(3);
}
function vis(el,on){el.style.visibility=on?'visible':'hidden'}
function show(id,on){const el=$(id);const v=on?'block':'none';if(el.style.display!==v)el.style.display=v}
function setHTML(el,h){if(el._h!==h){el.innerHTML=h;el._h=h}}
function fit(ar,mw,mh){let w=mw,h=mw*ar[1]/ar[0];if(h>mh){h=mh;w=mh*ar[0]/ar[1]}return {w:Math.round(w),h:Math.round(h)}}

function buildK(el){
  const acc=el.dataset.acc||'g';
  const toks=el.dataset.k.split(' ');
  el.innerHTML='';
  toks.forEach((tok,i)=>{
    if(i) el.appendChild(document.createTextNode(' '));
    const s=document.createElement('span'); s.className='w';
    let txt=tok;
    if(/^\{.*\}$/.test(txt)){txt=txt.slice(1,-1);s.classList.add('acc-'+acc)}
    if(/^\[.*\]$/.test(txt)){txt=txt.slice(1,-1);s.classList.add('en')}
    s.textContent=txt.replace(/_/g,' ');
    el.appendChild(s);
  });
  el._w=[...el.querySelectorAll('.w')];
}

  if(html)back.innerHTML=html;else back.textContent=label; inn.appendChild(back);
  for(let i=layers;i>=1;i--){const d=document.createElement('div');d.className='disc';d.style.background=mixHex(e1,e2,i/layers);d.style.transform=`translateZ(${-i*depth}px)`;inn.appendChild(d)}

  el.appendChild(inn);
}

function K(id,t,start,{st=.06,d=.42,type='flip',out=null,od=.26,ost=.03}={}){
  const el=$(id), ws=el._w;
  ws.forEach((w,i)=>{
    const p=P(t,start+i*st,d); let o=clamp(p*2.5), x=0,y=0,z=0,rx=0,rz=0,s=1;
    if(type==='flip'){const e=E.o3(p);rx=(1-e)*-100;y=(1-e)*34}
    else if(type==='pop'){s=.15+.85*E.back(p)}
    else if(type==='slam'){const e=E.o5(p);s=lerp(3,1,e);o=clamp(p*4)}
    else if(type==='drop'){y=(1-E.back(p))*-120;rz=(1-E.o3(p))*-12}
    else if(type==='up'){const e=E.o3(p);y=(1-e)*60}
    if(out!==null){const q=E.i3(P(t,out+i*ost,od));y-=q*90;o*=1-q;rx+=q*70}
    tr(w,{x,y,z,rx,rz,s,o});
  });
}
function letters(id,t,start,st,d){
  $(id)._l.forEach((s,i)=>{const p=P(t,start+i*st,d),e=E.o3(p);tr(s,{y:(1-e)*-70,rx:(1-e)*95,s:lerp(1.4,1,e),o:clamp(p*3)})});
}
function chips(id,t,start,st,out){
  const el=$(id); const cs=el._c||(el._c=[...el.children]);
  cs.forEach((c,i)=>{const p=P(t,start+i*st,.36);let s=E.back(p),o=clamp(p*3);
    if(out!==undefined){const q=E.i3(P(t,out+i*.04,.22));s*=1-q*.6;o*=1-q}
    tr(c,{s,o,y:(1-E.o3(p))*34,rx:(1-E.o3(p))*-50})});
}
function header(pre,t,t0,segs){
  const p=P(t,t0,.42); tr($(pre+'_hdrw'),{y:lerp(-90,0,E.back(p)),o:clamp(p*3)});
  const bs=$(pre+'_segs').querySelectorAll('b');
  segs.forEach(([a,b],i)=>{bs[i].style.width=(P(t,a,b-a)*100)+'%'});
}

  const app=$(pre+'_app'), pin=P(t,t0,.42), pe=E.o5(pin);
  const pout=k===3?E.i3(P(u,4.72,.28)):0;
  const push=E.io3(P(u,3.0,.35))*(1-E.io3(P(u,4.72,.28)));
  tr(app,{z:lerp(-1400,0,pe)-push*240,rx:lerp(42,4,pe)+Math.sin(t*1.1)*1.2,ry:Math.sin(t*.8)*2.2,y:Math.sin(t*1.4)*5+pout*420,s:1-pout*.2,o:clamp(pin*3)*(1-pout)});
  $(pre+'_dim').style.opacity=(push*.62).toFixed(3);
  /* composer */
  const att=E.io3(P(u,.92,.25))*(1-E.io3(P(u,2.0,.2))), ch=196+150*att;
  $(pre+'_comp').style.height=ch.toFixed(1)+'px';
  $(pre+'_chat').style.height=(920-112-20-ch-8).toFixed(1)+'px';
  const tx=$(pre+'_txt'); tx.style.top=(30+150*att).toFixed(1)+'px';
  let h;
  if(u<1.22||u>=2.0) h='<span class="gph">Create image</span>';
  else{const n=Math.floor(P(u,1.22,.6)*d.p.length);h=esc(d.p.slice(0,n));if(n<d.p.length||Math.floor(t*4)%2===0)h+='<span class="gcar"></span>'}
  setHTML(tx,h);
  const thp=P(u,1.17,.2); tr($(pre+'_th'+k),{s:lerp(.6,1,E.back(thp)),o:clamp(thp*4)*(1-P(u,1.98,.08))});
  tr($(pre+'_plus'),{s:1-Math.sin(Math.PI*P(u,.88,.14))*.18});
  tr($(pre+'_send'),{s:1-Math.sin(Math.PI*P(u,1.93,.14))*.14});
  /* original photo card, then its flight into the composer */
  if(u<1.22){
    const ow=$(pre+'_o'+k), p=P(u,0,.35), e=E.o5(p), idle=P(u,.35,.3), f=E.io3(P(u,.92,.28)), oc=g.oc;
    let dx=0,dy=0,s1=1;
    if(f>0){const r=$(pre+'_slot').getBoundingClientRect();dx=(r.left+r.width/2-540)*f;dy=(r.top+r.height/2-700)*f;s1=lerp(1,r.height*1.05/Math.min(oc.w,oc.h),f)}
    const fr=1-f;
    tr(ow,{x:dx,y:dy+Math.sin(t*1.6)*6*idle*fr,z:lerp(-1300,0,e),rx:lerp(50,0,e)+Math.cos(t*1.3)*3*idle*fr,ry:lerp(-25,0,e)+Math.sin(t*1.1)*5*idle*fr,rz:-6*Math.sin(Math.PI*f),s:s1,o:clamp(p*3)*(1-clamp((f-.8)*5))});
    $(pre+'_ot'+k).style.opacity=(clamp(P(u,.15,.25))*(1-clamp(f*4))).toFixed(3);
  }
  /* chat thread */
  if(u>=2.0&&u<4.9){
    const ui=E.o3(P(u,2.0,.25)); tr($(pre+'_u'+k),{y:(1-ui)*240,o:clamp(ui*2)});
    $(pre+'_thr').style.transform=`translateY(${(-g.sy*E.io3(P(u,2.15,.3))).toFixed(1)}px)`;
    const al=P(u,2.16,.25); tr($(pre+'_al'+k),{x:(1-E.o3(al))*-30,o:al});
    const gi=P(u,2.18,.25); tr($(pre+'_g'+k),{s:lerp(.94,1,E.o3(gi)),o:gi});
    $(pre+'_gb'+k).style.opacity=(clamp(P(u,2.2,.3))*(1-P(u,2.9,.12))).toFixed(3);
    const rp=P(u,2.25,.75), a=lerp(-18,100,rp), m=`linear-gradient(180deg,#000 ${a.toFixed(2)}%,transparent ${(a+18).toFixed(2)}%)`;
    const gs=$(pre+'_gs'+k); gs.style.webkitMaskImage=m; gs.style.maskImage=m;
    const sc=$(pre+'_sc'+k); sc.style.top=((a+9)/100*g.ai.h-45).toFixed(1)+'px'; sc.style.opacity=(rp>0&&rp<1?1:0);
    const lb=$(pre+'_l'+k);
    if(u<3.0){setHTML(lb,'Creating image');lb.style.backgroundPosition=`${(100-((t*1.1)%1)*100).toFixed(1)}% 0`}
    else{setHTML(lb,'Image created');lb.style.background='none';lb.style.color='#5D5D5D'}
    if(u<3.0){lb.style.background='';lb.style.color=''}
  }else $(pre+'_thr').style.transform='none';
  /* the result pops out of the chat, with the input pill under it */
  if(u>=3.0){
    const p=P(u,3.0,.4), e=E.o5(p), q=E.i3(P(u,4.72,.28)), br=g.br, hold=P(u,3.4,.3);
    const src=$(pre+'_g'+k).getBoundingClientRect();
    const sx=src.left+src.width/2-540, sy=src.top+src.height/2-BIGC, s0=src.width/br.w;
    tr($(pre+'_r'+k),{x:lerp(sx,0,e)-q*1300,y:lerp(sy,0,e)+Math.sin((u-3.4)*2.4)*6*hold,rx:-8*Math.sin(Math.PI*p),ry:Math.sin(t*1.2)*4*hold,rz:-q*22,s:lerp(s0,1,E.back(p)),o:1-q});
    const pp=P(u,3.2,.35);
    tr($(pre+'_pp'+k),{x:-q*1300,y:(1-E.o3(pp))*50+Math.sin((u-3.55)*3)*4*P(u,3.55,.3),rz:-q*22,s:E.back(pp),o:clamp(pp*3)*(1-q)});
  }
  /* caption */
  K(pre+'_cap'+k,t,T+.12,{st:.07,type:'flip',d:.4,out:T+4.72});
  const cw=$(pre+'_cap'+k)._w.filter(w=>w.className.includes('acc-')), bq=P(u,3.0,.4);
  if(bq>0&&bq<1)cw.forEach(w=>w.style.transform+=` scale(${(1+.25*Math.sin(Math.PI*bq)).toFixed(3)})`);
}
F.S4=t=>chapter(0,t);
F.S6=t=>chapter(1,t);

F.S7=function(t){
  const S=$('S7'); S.style.transform='none'; S.style.opacity=1;
  K('o_t',t,48.52,{st:.06,type:'slam',d:.32});
  K('o_s',t,48.85,{st:.04,type:'up',d:.35});
  chips('o_ch1',t,49.4,.1); chips('o_ch2',t,49.55,.1);
  K('o_b',t,49.9,{st:.08,type:'flip',d:.4});
  const p=P(t,50.15,.4); tr($('o_comp'),{y:lerp(300,0,E.o5(p))+Math.sin(t*1.5)*5*P(t,50.6,.4),rx:lerp(55,0,E.o5(p)),o:clamp(p*3)});
  const n=Math.floor(P(t,50.45,1.4)*TIP.length);
  let h=n>0?esc(TIP.slice(0,n)):'<span class="gph">Ask anything</span>';
  if(t<52.05&&(n<TIP.length||Math.floor(t*4)%2===0))h+='<span class="gcar"></span>';
  setHTML($('o_txt'),h);
  tr($('o_send'),{s:1-Math.sin(Math.PI*P(t,52.03,.14))*.14});
  chips('o_ok',t,52.25,.1);
  const ok=$('o_ok')._c[0]; if(t>52.6) ok.style.transform+=` translateY(${(Math.sin((t-52.6)*3)*4).toFixed(1)}px)`;
};

F.S8=function(t){
  const S=$('S8'), fin=P(t,58.0,.5);
  S.style.transform=fin>0&&fin<1?`scale(${(1+.045*Math.sin(Math.PI*fin)).toFixed(4)})`:'none'; S.style.opacity=1;
  let p=P(t,53.55,.45); tr($('p_card'),{y:lerp(260,0,E.o5(p)),rx:lerp(40,0,E.o5(p)),rz:lerp(-4,0,E.back(p)),o:clamp(p*3)});
  $('p_tiles')._c.forEach((tl,i)=>{const q=P(t,53.8+i*.06,.35);tr(tl,{s:lerp(.6,1,E.back(q)),o:clamp(q*3)})});
  const sel=$('p_t2'), f=E.o3(P(t,54.85,.3));
  sel.querySelector('.pf').style.width=(f*100)+'%'; sel.querySelector('span').style.color=f>.5?'#fff':'#1A1D24';
  const pk=sel.querySelector('.pk'), kq=P(t,54.95,.3); pk.style.opacity=kq.toFixed(3); pk.style.transform=`scale(${E.back(kq).toFixed(3)})`;
  sel.style.transform+=` scale(${(1-Math.sin(Math.PI*P(t,54.8,.14))*.05).toFixed(3)})`;
  const sp=P(t,55.7,.28), st=$('p_stamp'); vis(st,sp>0);
  tr(st,{s:lerp(2.8,1,E.o5(sp)),rz:-12,o:clamp(sp*3)});
  K('p_c',t,56.2,{st:.07,type:'flip',d:.4});
  const ws=$('p_c')._w, arw=ws[ws.length-1]; if(t>56.6) arw.style.transform+=` translateY(${(-Math.abs(Math.sin((t-56.6)*5))*18).toFixed(1)}px)`;
  chips('p_ch',t,56.7,.15);
  const q=P(t,57.2,.4); tr($('p_h'),{y:(1-E.o3(q))*30,o:q});
};

/* ===================== init + seek ===================== */
function init(){
  buildChapter(0); buildChapter(1);
  $('p_tiles').innerHTML=DEMOS.map((d,i)=>`<div class="ptile" id="p_t${i}"><div class="pf"></div><div class="im"><img src="img/rt${d.n}.${d.ext}"><div class="pk">✓</div></div><span>${esc(d.p.split(' ')[0])}</span></div>`).join('');
  $('p_tiles')._c=[...$('p_tiles').children];
  icons(document);
  document.querySelectorAll('[data-k]').forEach(buildK);
  document.querySelectorAll('.letters').forEach(buildLetters);
  buildCoin($('h_vs'),{html:'<div style="width:116px;height:116px;color:#0D0D0D">'+LOGO+'</div>',face:'radial-gradient(circle at 35% 30%,#FFFFFF,#E4E7EE 60%,#BFC5D2)',e1:'#8C95A6',e2:'#2E3440',color:'#0A0C11',font:"900 86px Inter"});
  buildExt($('a_big'),'/',{layers:20,depth:3.4,c1:'#E0753A',c2:'#2A0F06'});
  const gl=$('glitch'); for(let i=0;i<10;i++) gl.appendChild(document.createElement('i'));
  initGrain();
  const tile=$('p_t2'); BURSTS.push({t:R(54.87),x:0,y:0,n:26,spd:700,cols:['#FF7A3D','#FFD2B8','#fff'],kind:'spark',flare:.3,_id:'p_t2'});
  const s8=$('S8'); s8.style.display='block'; const r=tile.getBoundingClientRect(); s8.style.display='none';
  BURSTS[BURSTS.length-1].x=r.left+r.width/2; BURSTS[BURSTS.length-1].y=r.top+r.height/2;
}
function seek(t){
  const ti=t/FS;
  drawBG(t);
  for(const [id,a,b] of SC){const el=$(id),on=ti>=a&&(ti<b||id==='S8');el.style.display=on?'block':'none';if(on)F[id](ti)}
  camera(t); overlays(t); drawFX(t); cursor(ti); grain(t);
}
window.seek=seek; window.DUR=DUR; window.CUES=CUES; window.FS=FS; window.MUSIC=MUSIC;
document.fonts.ready.then(async()=>{
  await Promise.all([...document.fonts].map(f=>f.load().catch(()=>{})));
  init();
  await Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));
  const q=new URLSearchParams(location.search);seek(q.has('t')?parseFloat(q.get('t')):0);window.READY=true;
});
</script>
